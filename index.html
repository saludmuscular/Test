<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Chequeo Panalab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1526;
    --card:#161F38;
    --card-line:#26314F;
    --text:#F5F3EE;
    --muted:#8B93A8;
    --muscle:#FF5A4E;
    --muscle-dim:#3A2320;
    --joint:#35C9C1;
    --joint-dim:#173230;
    --accent:var(--muscle);
    --accent-dim:var(--muscle-dim);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:radial-gradient(circle at 50% -10%, #1A2340 0%, #0E1526 55%);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 16px 60px;
  }
  #app{width:100%;max-width:440px;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 6px;
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:30px;
    line-height:1.08;
    margin:0 0 4px;
    letter-spacing:-.01em;
  }
  .lede{color:var(--muted);font-size:14.5px;margin:0 0 26px;line-height:1.5;}

  /* ---- signal line (signature element) ---- */
  .signal{width:100%;height:34px;margin-bottom:18px;}
  .signal path{
    fill:none;
    stroke:var(--card-line);
    stroke-width:2;
  }
  .signal path.fill{
    stroke:var(--accent);
    stroke-dasharray:1;
    stroke-dashoffset:1;
    transition:stroke-dashoffset .5s ease;
    filter:drop-shadow(0 0 5px var(--accent));
  }

  .card{
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:18px;
    padding:26px 22px;
  }

  /* home screen choice cards */
  .choice{
    display:block;
    width:100%;
    text-align:left;
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:18px;
    padding:22px;
    margin-bottom:14px;
    cursor:pointer;
    color:var(--text);
    transition:border-color .15s, transform .15s;
  }
  .choice:active{transform:scale(.98);}
  .choice.muscle:hover{border-color:var(--muscle);}
  .choice.joint:hover{border-color:var(--joint);}
  .choice .tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    padding:3px 8px;
    border-radius:20px;
    display:inline-block;
    margin-bottom:12px;
  }
  .choice.muscle .tag{color:var(--muscle);background:var(--muscle-dim);}
  .choice.joint .tag{color:var(--joint);background:var(--joint-dim);}
  .choice h2{font-family:'Space Grotesk',sans-serif;font-size:21px;margin:0 0 6px;}
  .choice p{color:var(--muted);font-size:13.5px;margin:0;line-height:1.5;}

  /* quiz */
  .qcount{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--muted);
    margin-bottom:10px;
    letter-spacing:.05em;
  }
  .qcount b{color:var(--text);}
  .question{
    font-family:'Space Grotesk',sans-serif;
    font-size:22px;
    line-height:1.28;
    margin:0 0 22px;
  }
  .opt{
    display:block;
    width:100%;
    text-align:left;
    background:#101830;
    border:1px solid var(--card-line);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:15px;
    padding:15px 16px;
    border-radius:12px;
    margin-bottom:10px;
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .opt:hover{border-color:var(--accent);background:#141E3C;}

  /* result */
  .badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:10px;
  }
  .result-title{
    font-family:'Space Grotesk',sans-serif;
    font-size:25px;
    line-height:1.2;
    margin:0 0 14px;
  }
  .result-text{font-size:14.5px;line-height:1.6;color:#D7DAE5;margin:0 0 20px;}
  .product{
    display:flex;
    gap:14px;
    align-items:center;
    background:#101830;
    border:1px solid var(--card-line);
    border-radius:14px;
    padding:16px;
    margin-bottom:20px;
  }
  .product .dot{
    width:44px;height:44px;flex:none;border-radius:50%;
    background:var(--accent-dim);
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
  }
  .product .pname{font-family:'Space Grotesk',sans-serif;font-size:17px;margin:0 0 2px;}
  .product .pdesc{font-size:12.5px;color:var(--muted);margin:0;line-height:1.4;}

  .btn{
    display:block;
    width:100%;
    text-align:center;
    background:var(--accent);
    color:#0E1526;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:15px;
    padding:14px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    margin-bottom:12px;
  }
  .btn.ghost{
    background:transparent;
    color:var(--muted);
    border:1px solid var(--card-line);
    font-weight:500;
  }
  .disclaimer{
    font-size:11px;
    color:#5C6480;
    line-height:1.5;
    margin-top:4px;
  }
  .home-footer{
    text-align:center;
    font-size:11px;
    color:#4A5170;
    margin-top:22px;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const MUSCLE_Q = [
  {q:"¿Te cuesta levantarte de una silla sin apoyarte con las manos?",
   o:[["Sí, siempre",1],["A veces",2],["Rara vez",3],["Nunca, sin problema",4]]},
  {q:"Subís 2 o 3 pisos por escalera. ¿Cómo llegás arriba?",
   o:[["Agotado/a, necesito parar",1],["Cansado/a, pero llego",2],["Un poco acelerado/a",3],["Como si nada",4]]},
  {q:"En el último año, tu fuerza para cargar bolsas o mover cosas…",
   o:[["Bajó bastante",1],["Bajó un poco",2],["Se mantuvo",3],["Mejoró",4]]},
  {q:"Después de un esfuerzo físico, ¿cuánto tardás en recuperarte?",
   o:[["Más de 2 días",1],["1 o 2 días",2],["Al otro día ya estoy bien",3],["Casi no siento cansancio",4]]},
  {q:"¿Cuántos días por semana hacés algo de actividad física?",
   o:[["Ninguno",1],["1 día",2],["2 a 3 días",3],["4 días o más",4]]}
];

const JOINT_Q = [
  {q:"Al levantarte a la mañana, ¿sentís rigidez en las articulaciones?",
   o:[["Sí, tardo en 'soltarme'",1],["Un poco",2],["Casi nada",3],["Nada",4]]},
  {q:"¿Escuchás crujidos o 'clicks' al mover rodillas, hombros o manos?",
   o:[["Sí, seguido",1],["A veces",2],["Muy de vez en cuando",3],["Nunca",4]]},
  {q:"¿Alguna molestia articular te limita en el día a día (escaleras, agacharte)?",
   o:[["Sí, bastante",1],["Un poco",2],["Casi nunca",3],["No, ninguna",4]]},
  {q:"Comparado con hace 5 años, tu movilidad general…",
   o:[["Empeoró notablemente",1],["Empeoró un poco",2],["Se mantiene igual",3],["Sigue igual o mejoró",4]]},
  {q:"¿Tus articulaciones molestan más con el frío o la humedad?",
   o:[["Sí, mucho",1],["Un poco",2],["Casi nada",3],["No, nada",4]]}
];

const RESULTS_MUSCLE = [
  {max:9, badge:"Resultado", title:"Tu energía muscular pide un envión 💪",
   text:"Te cuesta más de lo que quisieras levantarte, subir escaleras o recuperarte del esfuerzo. Son señales típicas de que la masa y la fuerza muscular necesitan un refuerzo extra, además de la actividad física.",
   product:"Reversal®", pdesc:"Te ayuda a recuperar tu fuerza y masa muscular."},
  {max:15, badge:"Resultado", title:"Vas bien, con margen para fortalecerte",
   text:"Tu cuerpo responde, pero hay señales de cansancio y algo de pérdida de fuerza. Es un buen momento para sumar un soporte nutricional a tu rutina, antes de que se note más.",
   product:"Reversal®", pdesc:"Te acompaña en tu rutina."},
  {max:20, badge:"Resultado", title:"¡Tu fuerza está en su mejor nivel! 🔥",
   text:"Subís, cargás y te recuperás sin drama. La masa muscular se mantiene con esfuerzo constante — el objetivo ahora es sostener este nivel en el tiempo.",
   product:"Reversal®", pdesc:"Un aliado para tu salud muscular."}
];

const RESULTS_JOINT = [
  {max:9, badge:"Resultado", title:"Tus articulaciones piden atención 🦴",
   text:"Rigidez, crujidos y molestias que limitan el día a día: son señales de que tus articulaciones necesitan un soporte natural y constante.",
   product:"Sojapal Plus", pdesc:"Colágeno tipo II no desnaturalizado + insaponificables de palta y soja, la respuesta natural para la movilidad."},
  {max:15, badge:"Resultado", title:"Movilidad estable, pero cuidala",
   text:"No hay grandes limitaciones, pero aparecen señales ocasionales de rigidez o molestia. Buen momento para reforzar con una fórmula más completa.",
   product:"Cartrexan® en polvo o cápsulas blandas", pdesc:"Colágeno hidrolizado + cúrcuma + ácido hialurónico, para reforzar la movilidad y reducir molestias."},
  {max:20, badge:"Resultado", title:"¡Tus articulaciones se mueven joya! ✨",
   text:"Buena movilidad, sin rigidez ni molestias relevantes. La idea ahora es sostenerlo con la fórmula más completa de la línea.",
   product:"Cartrexan® Polvo para reconstituir", pdesc:"Colágeno hidrolizado + cúrcuma + ácido hialurónico, sabor cítrico — la nueva fórmula para una movilidad sin dolor."}
];

let state = {screen:'home', quiz:null, idx:0, score:0};

function setTheme(kind){
  document.documentElement.style.setProperty('--accent', kind==='muscle' ? 'var(--muscle)' : 'var(--joint)');
  document.documentElement.style.setProperty('--accent-dim', kind==='muscle' ? 'var(--muscle-dim)' : 'var(--joint-dim)');
}

function signalSvg(progress, kind){
  // simple heartbeat-ish path shared by both quizzes, colored per theme
  const path = "M0,17 L60,17 L75,4 L90,30 L105,17 L160,17 L175,10 L190,24 L205,17 L440,17";
  return `<svg class="signal" viewBox="0 0 440 34" preserveAspectRatio="none">
    <path d="${path}"></path>
    <path class="fill" d="${path}" pathLength="1" style="stroke-dashoffset:${1-progress}"></path>
  </svg>`;
}

function render(){
  const app = document.getElementById('app');

  if(state.screen==='home'){
    setTheme('muscle');
    app.innerHTML = `
      <p class="eyebrow">Chequeo Panalab · 1 minuto</p>
      <h1>¿Cómo está tu cuerpo hoy?</h1>
      <p class="lede">Elegí un test rápido de 5 preguntas y te decimos qué podés reforzar.</p>

      <div class="choice muscle" onclick="startQuiz('muscle')">
        <span class="tag">Energía muscular</span>
        <h2>💪 Chequeo Muscular</h2>
        <p>Fuerza, resistencia y recuperación. 5 preguntas.</p>
      </div>

      <div class="choice joint" onclick="startQuiz('joint')">
        <span class="tag">Movilidad articular</span>
        <h2>🦴 Chequeo Articular</h2>
        <p>Rigidez, dolor y flexibilidad. 5 preguntas.</p>
      </div>

      <p class="home-footer">Suplementos dietarios Panalab® — Reversal® · Cartrexan® · Sojapal®</p>
    `;
    return;
  }

  const bank = state.quiz==='muscle' ? MUSCLE_Q : JOINT_Q;
  setTheme(state.quiz);

  if(state.screen==='quiz'){
    const q = bank[state.idx];
    const progress = state.idx/bank.length;
    app.innerHTML = `
      ${signalSvg(progress, state.quiz)}
      <div class="card">
        <p class="qcount"><b>${state.idx+1}</b> / ${bank.length}</p>
        <p class="question">${q.q}</p>
        ${q.o.map(opt=>`<button class="opt" onclick="answer(${opt[1]})">${opt[0]}</button>`).join('')}
      </div>
    `;
    return;
  }

  if(state.screen==='result'){
    const bankResults = state.quiz==='muscle' ? RESULTS_MUSCLE : RESULTS_JOINT;
    const r = bankResults.find(r=>state.score<=r.max);
    app.innerHTML = `
      ${signalSvg(1, state.quiz)}
      <div class="card">
        <p class="badge">${r.badge}</p>
        <h2 class="result-title">${r.title}</h2>
        <p class="result-text">${r.text}</p>
        <div class="product">
          <div class="dot">${state.quiz==='muscle' ? '💪' : '🦴'}</div>
          <div>
            <p class="pname">${r.product}</p>
            <p class="pdesc">${r.pdesc}</p>
          </div>
        </div>
        <button class="btn" onclick="goHome()">Volver al inicio</button>
        <p class="disclaimer">Test orientativo, no reemplaza una consulta médica. Los suplementos dietarios no son medicamentos ni sustituyen un tratamiento.</p>
      </div>
    `;
    return;
  }
}

function startQuiz(kind){
  state = {screen:'quiz', quiz:kind, idx:0, score:0};
  render();
}
function answer(points){
  state.score += points;
  state.idx += 1;
  const bank = state.quiz==='muscle' ? MUSCLE_Q : JOINT_Q;
  if(state.idx>=bank.length){ state.screen='result'; }
  render();
}
function goHome(){
  state = {screen:'home', quiz:null, idx:0, score:0};
  render();
}

render();
</script>
</body>
</html>
